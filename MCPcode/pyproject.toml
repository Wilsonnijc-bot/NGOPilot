[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ngopilot-mcp"
version = "0.1.0"
description = "Local MCP tools for CareFlow and RosterCopiilot workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp==1.29.0",
  "pydantic==2.13.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]

[project.scripts]
ngopilot-mcp = "ngopilot_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ngopilot_mcp = [
  "vendor.lock.toml",
  "vendor_wheels/*.whl",
  "runtime_locks/*.lock",
  "payloads/careflow/LICENSE",
  "payloads/careflow/backend/pyproject.toml",
  "payloads/careflow/backend/app/*.py",
  "payloads/careflow/backend/app/**/*.py",
  "payloads/careflow/backend/app/services/visit_note_agent/prompts/*.txt",
  "payloads/careflow/backend/data/form_templates/*.json",
  "payloads/careflow/backend/data/templates/*.pdf",
  "payloads/careflow/backend/data/templates/*.xlsx",
  "payloads/rostercopiilot/pyproject.toml",
  "payloads/rostercopiilot/backend/app/*.py",
  "payloads/rostercopiilot/backend/app/**/*.py",
  "payloads/rostercopiilot/docs/*.xlsx",
]

[tool.setuptools.exclude-package-data]
"*" = [
  "**/__pycache__/*",
  "**/*.pyc",
  "**/*.pyo",
  "**/.env",
  "**/.env.*",
  "**/*.db",
  "**/*.sqlite",
  "**/*.sqlite3",
  "**/logs/*",
  "**/uploads/*",
  "**/build/*",
  "**/*.egg-info/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --import-mode=importlib"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
extend-exclude = ["src/ngopilot_mcp/payloads"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
