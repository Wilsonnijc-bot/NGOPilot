# RosterCopiilot first-certificate bootstrap.
#
# Enable this site only long enough to obtain the initial Let's Encrypt
# certificate. It serves the ACME challenge from the standard Nginx webroot
# and deliberately returns 503 for every application request, so no Basic-auth
# credential or demo data ever crosses plaintext HTTP.

server {
    listen 80;
    listen [::]:80;
    server_name REPLACE_WITH_DOMAIN;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        auth_basic off;
        allow all;
    }

    location / {
        return 503;
    }
}
