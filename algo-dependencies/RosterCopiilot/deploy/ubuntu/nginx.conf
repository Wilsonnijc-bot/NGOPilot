# RosterCopiilot reverse proxy (supervised demo)
# Install to /etc/nginx/sites-available/rostercopiilot and symlink into
# sites-enabled. Replace REPLACE_WITH_DOMAIN and the TLS cert paths.
#
# Architecture:
#   Browser --HTTPS--> Nginx (TLS + HTTP Basic auth + security headers)
#     |-- /            -> static frontend (/opt/rostercopiilot/current/frontend)
#     `-- /api/*       -> Uvicorn on 127.0.0.1:8000
#
# The interactive API docs live at /docs, /redoc, /openapi.json which are NOT
# under /api and therefore never proxied here; they are also disabled in-app in
# production. Uvicorn is bound to loopback and must never be exposed directly.

# Redirect all plaintext HTTP to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name REPLACE_WITH_DOMAIN;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name REPLACE_WITH_DOMAIN;

    # --- TLS (obtain via certbot; paths below are the certbot defaults) ------
    ssl_certificate     /etc/letsencrypt/live/REPLACE_WITH_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/REPLACE_WITH_DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # --- Access-control gate (minimum public exposure requirement) ----------
    # Credentials live in a root-owned htpasswd file created on the server
    # (NOT in git). Generate with:  sudo htpasswd -c /etc/nginx/rostercopiilot.htpasswd demo
    auth_basic "RosterCopiilot supervised demo";
    auth_basic_user_file /etc/nginx/rostercopiilot.htpasswd;

    # --- Security headers ----------------------------------------------------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    # 'unsafe-inline' for script/style is required because the demo UI ships a
    # single-file inline script/style bundle; all dynamic content is HTML-escaped
    # in the frontend. Everything else is same-origin only.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;

    # --- Upload cap (slightly above the app's ROSTER_MAX_UPLOAD_MB) ----------
    client_max_body_size 12m;

    # --- Static frontend -----------------------------------------------------
    root /opt/rostercopiilot/current/frontend;
    index index.html;
    autoindex off;

    location = / {
        try_files /index.html =404;
    }

    # Long-lived immutable vendored assets may be cached.
    location /vendor/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
    }

    # --- API proxy -----------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Review revalidation and workbook export can run several seconds on
        # larger weeks; allow generous read timeouts.
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # API responses must never be cached by shared proxies/browsers.
        add_header Cache-Control "no-store" always;
    }

    # --- Deny sensitive paths (defense in depth) -----------------------------
    # The static root only contains index.html + vendor/, but block dotfiles,
    # data, env, source and VCS metadata if the layout ever changes.
    location ~ /\.(?!well-known) { deny all; }
    location ~* \.(db|db-wal|db-shm|env|sqlite3?)$ { deny all; }
    location ~ ^/(backend|docs|deploy|data|\.git)/ { deny all; }
}
