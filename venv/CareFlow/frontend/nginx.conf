limit_req_zone $binary_remote_addr zone=careflow_api:10m rate=120r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_body_timeout 30s;
    client_header_timeout 10s;
    keepalive_timeout 30s;

    # Basic public demo guard. The password file is mounted by Docker Compose
    # so secrets stay out of the image and repository.
    auth_basic "CareFlow demo";
    auth_basic_user_file /etc/nginx/.htpasswd;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;

    location ~ /\.(?!well-known) {
        deny all;
    }

    location = /healthz {
        auth_basic off;
        access_log off;
        return 204;
    }

    # SPA fallback：任何前端 route 一律回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Demo intro videos are mounted from ./asset/videos by Docker Compose.
    # Keep this route outside the SPA fallback so missing videos return 404
    # instead of index.html.
    location /demo-videos/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # Bundled demo animations are mounted from ./asset/html and rendered inside
    # the same-origin intro modal iframe.
    location /demo-html/ {
        try_files $uri =404;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # 反代後端 API
    location /api/ {
        limit_req zone=careflow_api burst=60 nodelay;

        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50M;

        # v0.4.6-nginx-timeout：gpt-5-mini vision/mapping 在複雜表單上經常
        # 超過 5 分鐘；demo 出現過 504 Gateway Time-out。統一拉到 10 分鐘，
        # 並關閉 response buffering 讓串流式回包能即時推給前端。
        proxy_connect_timeout 30s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
        send_timeout          600s;
        proxy_buffering       off;
        proxy_request_buffering off;
    }

    # /files/ 大檔下載也走後端（音檔/PDF 預覽）
    location /files/ {
        proxy_pass http://backend:8000/files/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50M;
        proxy_read_timeout 600s;
        proxy_buffering off;
    }
}
